[project]
name = "ResNet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "onnx==1.18.0",
    "onnxruntime-gpu==1.20.0",
    "prettytable>=3.17.0",
    "psutil>=7.2.2",
    "tensorboard>=2.20.0",
    "tensorrt==10.16.0.72",
    "torch==2.11.0",
    "torch-pruning==1.6.1",
    "torchsummary>=1.5.1",
    "umap-learn>=0.5.11",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128"},
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
